<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="903" cy="483" r="73" fill="#6d28d9" opacity="0.11"/>
    <circle cx="-55" cy="629" r="32" fill="#6d28d9" opacity="0.17"/>
    <circle cx="237" cy="637" r="69" fill="#6d28d9" opacity="0.09"/>
    <circle cx="1121" cy="235" r="93" fill="#6d28d9" opacity="0.16"/>
    <circle cx="156" cy="596" r="89" fill="#6d28d9" opacity="0.07"/>
    <circle cx="430" cy="327" r="72" fill="#6d28d9" opacity="0.09"/>
    <rect x="-81" y="604" width="77" height="65" rx="8" fill="#7c3aed" opacity="0.12" transform="rotate(17, 817, 420)"/>
    <rect x="-77" y="133" width="63" height="61" rx="8" fill="#7c3aed" opacity="0.09" transform="rotate(21, 683, 327)"/>
    <rect x="189" y="237" width="47" height="30" rx="8" fill="#7c3aed" opacity="0.13" transform="rotate(28, 1262, 99)"/>
    <rect x="492" y="293" width="70" height="97" rx="8" fill="#7c3aed" opacity="0.07" transform="rotate(36, 1010, 616)"/>
    <rect x="786" y="315" width="55" height="32" rx="8" fill="#7c3aed" opacity="0.12" transform="rotate(33, 1225, 145)"/>
    <rect x="1183" y="589" width="40" height="33" rx="8" fill="#7c3aed" opacity="0.11" transform="rotate(4, 203, 150)"/>
    <rect x="957" y="310" width="67" height="67" rx="8" fill="#7c3aed" opacity="0.14" transform="rotate(40, 492, 486)"/>
    <rect x="349" y="79" width="42" height="55" rx="8" fill="#7c3aed" opacity="0.04" transform="rotate(28, 550, 163)"/>
    <polygon points="202,-86 293,96 111,96" fill="#6d28d9" opacity="0.04"/>
    <polygon points="21,552 85,680 -43,680" fill="#6d28d9" opacity="0.11"/>
    <polygon points="451,569 531,729 371,729" fill="#6d28d9" opacity="0.10"/>
    <polygon points="18,-140 87,-2 -51,-2" fill="#6d28d9" opacity="0.03"/>

  <!-- Wave at bottom -->
  <path d="M0,568 C360,599 840,537 1200,568 L1200,630 L0,630Z" fill="#6d28d9" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 유흥 투명 정찰제 가격 정보 디렉토리
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — 가격 투명성 감시
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#f472b6" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     마포 유흥 투명 정찰제 가격 정보 디렉토리 — 가격 투명성 감시
  </text>
</svg>